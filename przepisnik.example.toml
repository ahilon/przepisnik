# Copy to przepisnik.toml (ignored by Git). CLI options override these values.
# Local access by default. For LAN/Docker use host = "0.0.0.0".
host = "127.0.0.1"
port = 8000
# Exact browser URLs: no trailing slash. Include the browser-facing port.
origins = ["http://localhost:8000", "http://127.0.0.1:8000"]
# LAN example (replace with your own hostname and reserved IP):
# origins = ["http://my-recipes.local:8000", "http://192.168.1.50:8000"]
