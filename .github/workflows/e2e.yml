name: E2E sanity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the outdated run.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked

      # Browser binaries depend on the locked Playwright version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv run playwright install --with-deps chromium

      # Keep the check name stable for existing branch rules. Full E2E run after merge.
      # Each sanity case uses an isolated server and disposable data.
      - name: Run core browser sanity scenarios
        run: >-
          uv run --locked pytest tests/e2e -m sanity --strict-markers -p no:cacheprovider
          --browser chromium --tracing retain-on-failure --output test-results
          --release-results "${{ runner.temp }}/sanity-results.json"

      - name: Require every selected sanity test to pass
        run: uv run --locked python -m scripts.release verify-tests "${{ runner.temp }}/sanity-results.json"

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
