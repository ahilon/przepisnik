name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Reused by the release workflow so images are published only after these tests pass.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The literal prefix keeps this group distinct from a calling workflow's group.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked
      # Unit and other non-browser tests; browser scenarios run in the E2E workflow.
      - run: >-
          uv run pytest tests --ignore=tests/e2e -p no:cacheprovider
          --cov --cov-report=term --cov-fail-under=80
          --release-results "$RUNNER_TEMP/unit-release.json"

      - name: Require every selected unit test to pass
        run: uv run --locked python -m scripts.release verify-tests "$RUNNER_TEMP/unit-release.json"

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
