name: Checkov

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the outdated run.
concurrency:
  group: checkov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # Settings (scanned frameworks and skipped paths) are read from .checkov.yaml.
      - run: uvx --python 3.12 --from checkov==3.4.3 checkov
