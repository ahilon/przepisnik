name: PR product version

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pr-product-version-${{ github.sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: Comment merged product version
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.event.after }}
    steps:
      # Inspect GitHub metadata only; never check out or execute PR code.
      - name: Comment the exact merged version on each associated PR
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          commits=$(gh api --paginate \
            "repos/$GH_REPO/compare/$BEFORE_SHA...$AFTER_SHA?per_page=100" \
            --jq '.commits[].sha')

          upsert_comment() {
            local pr_number=$1 merge_sha=$2
            local metadata="$RUNNER_TEMP/product-version.toml"
            local payload="$RUNNER_TEMP/product-version-comment.json"
            local marker='<!-- przepisnik-product-version -->'
            local version comment_ids comment_id

            gh api "repos/$GH_REPO/contents/pyproject.toml?ref=$merge_sha" \
              --header 'Accept: application/vnd.github.raw+json' > "$metadata"
            version=$(python3 - "$metadata" <<'PY'
          import re
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected a numeric major.minor.patch product version")
          print(version)
          PY
            )
            comment_ids=$(gh api --paginate \
              "repos/$GH_REPO/issues/$pr_number/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | select(.body | startswith("<!-- przepisnik-product-version -->")) | .id')
            comment_id=${comment_ids%%$'\n'*}
            jq -n --arg body "$marker"$'\n'"Product version: **$version**" \
              '{body: $body}' > "$payload"
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
                --input "$payload" --silent
            else
              gh api --method POST "repos/$GH_REPO/issues/$pr_number/comments" \
                --input "$payload" --silent
            fi
          }

          while IFS= read -r merge_sha; do
            [[ -n "$merge_sha" ]] || continue
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
            # An associated PR can include this commit without having merged at it.
            pull_requests=$(gh api --paginate \
              "repos/$GH_REPO/commits/$merge_sha/pulls?per_page=100" \
              --jq ".[] | select(.base.ref == \"main\" and .merged_at != null and .merge_commit_sha == \"$merge_sha\") | .number")
            while IFS= read -r pr_number; do
              [[ -n "$pr_number" ]] || continue
              [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
              upsert_comment "$pr_number" "$merge_sha"
            done <<< "$pull_requests"
          done <<< "$commits"
