name: przepisnik-demo
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - demo-data:/demo-data
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/recipes', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
volumes:
  demo-data:
