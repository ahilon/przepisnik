[project]
name = "przepisnik"
version = "1.3.0"
description = "Build a recipe knowledge base from diet-plan PDFs and other sources."
readme = "README.md"
authors = [
    { name = "Pawel", email = "ziela111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    # 2.x pulls onnxruntime/numpy/pymupdf4llm (~100 MB) that this tool does not use.
    "pymupdf>=1.26,<2",
]

[project.scripts]
przepisnik = "przepisnik.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "D", "UP", "ANN", "B", "A", "C4",
  "SIM", "PTH", "RET", "ARG", "PL", "S", "T20", "RUF",
]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"src/przepisnik/cli.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF type hints are incomplete; untyped calls are confined to the adapter module.
module = ["przepisnik.adapters.pdf"]
disallow_untyped_calls = false
