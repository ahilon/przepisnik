[project]
name = "przepisnik"
version = "1.15.0"
description = "Build a recipe knowledge base from diet-plan PDFs and other sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pawel", email = "ziela111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pypdf>=7.1,<8",
    "pillow>=13,<14",
]

[project.scripts]
przepisnik = "przepisnik.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "D", "UP", "ANN", "B", "A", "C4",
  "SIM", "PTH", "RET", "ARG", "PL", "S", "T20", "RUF",
]
# Explicit return None is the project convention for methods returning no result.
ignore = ["D105", "D107", "RET501", "PLR1711"]

[tool.ruff.lint.per-file-ignores]
"src/przepisnik/cli.py" = ["T20"]
"src/przepisnik/tools/respo.py" = ["T20"]
# Pytest assertions express test expectations, not application security checks.
# Expected values are literal test data; Respo sources use en dashes as separators.
"tests/**/*.py" = ["S101", "PLR2004", "RUF001"]
# This declares a wildcard address; binding to it remains an explicit configuration choice.
"src/przepisnik/constants.py" = ["S104"]
# The only process boundary: resolved executable, separate arguments, shell=False, timeout.
"scripts/command_runner.py" = ["S603"]
"scripts/release.py" = ["T20"]
# Wildcard listeners are deliberate configuration fixtures, not open production sockets.
"tests/unit/test_config.py" = ["S104"]
"tests/unit/test_container_health.py" = ["S104"]
# Flexible test-data builders and heterogeneous decoded CLI JSON are intentionally scoped.
"tests/unit/factories.py" = ["PLR0913"]
"tests/unit/test_cli.py" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "sanity: core browser journeys exercised on pull requests"
]

[tool.coverage.run]
source = ["przepisnik", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
